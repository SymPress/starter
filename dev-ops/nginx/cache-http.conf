# Generated by SymPress Nginx Cache.
# Profile: safe.
# Integrated for this DDEV nginx-fpm project.
fastcgi_cache_path /var/cache/nginx/wordpress
    levels=1:2
    keys_zone=WORDPRESS:100m
    inactive=60m
    max_size=2g
    use_temp_path=off;

map $http_user_agent $sympress_cache_device {
    default desktop;
    ~*(Mobile|Android|Silk/|Kindle|BlackBerry|Opera\ Mini|Opera\ Mobi) mobile;
}

map $request_method $sympress_cache_skip_method {
    default 1;
    GET 0;
    HEAD 0;
}

map $query_string $sympress_cache_skip_query {
    default 1;
    "" 0;
    ~*^(?:(?:utm_[a-z0-9_]+|fbclid|gclid)=[^&]*)(?:&(?:utm_[a-z0-9_]+|fbclid|gclid)=[^&]*)*$ 0;
}

map $request_uri $sympress_cache_clean_uri {
    ~^(?<sympress_cache_original_path>[^?]*) $sympress_cache_original_path;
}

map $sympress_cache_skip_query $sympress_cache_request_uri {
    default $request_uri;
    0 $sympress_cache_clean_uri;
}

map $request_uri $sympress_cache_skip_uri {
    default 0;
    ~*^/wp-admin/ 1;
    ~*^/wp/wp-admin/ 1;
    ~*^/wp-login\.php 1;
    ~*^/wp/wp-login\.php 1;
    ~*^/wp-cron\.php 1;
    ~*^/wp/wp-cron\.php 1;
    ~*^/xmlrpc\.php 1;
    ~*^/wp/xmlrpc\.php 1;
    ~*^/wp-json/ 1;
    ~*^/index\.php/wp-json/ 1;
    ~*preview=true 1;
    ~*^/cart/? 1;
    ~*^/checkout/? 1;
    ~*^/order-pay/? 1;
    ~*^/order-received/? 1;
    ~*^/my-account/? 1;
    ~*^/account/? 1;
    ~*^/wc-api/ 1;
    ~*^/wp-json/wc/ 1;
    ~*^/wp-json/wc-store/ 1;
    ~*^/members/ 1;
    ~*^/membership/ 1;
    ~*^/member/ 1;
    ~*^/courses/ 1;
    ~*^/lesson/ 1;
    ~*^/dashboard/ 1;
}

map $http_cookie $sympress_cache_skip_cookie {
    default 0;
    ~*comment_author 1;
    ~*wordpress_[a-f0-9]+ 1;
    ~*wordpress_logged_in_ 1;
    ~*wordpress_sec_ 1;
    ~*wp-postpass_ 1;
    ~*preview_ 1;
    ~*woocommerce_cart_hash 1;
    ~*woocommerce_items_in_cart 1;
    ~*wp_woocommerce_session_ 1;
    ~*edd_items_in_cart 1;
    ~*edd_cart_token 1;
    ~*wp_llms_session_ 1;
    ~*llms_cart 1;
    ~*pmpro_visit 1;
    ~*mepr_ 1;
    ~*rcp_ 1;
    ~*wishlist_member 1;
    ~*swpm_ 1;
    ~*woocommerce_recently_viewed 1;
    ~*currency 1;
    ~*wcml_client_currency 1;
    ~*pll_language 1;
    ~*wp-wpml_current_language 1;
}

map $http_authorization $sympress_cache_skip_authorization {
    default 1;
    "" 0;
}

map "$sympress_cache_skip_method$sympress_cache_skip_query$sympress_cache_skip_uri$sympress_cache_skip_cookie$sympress_cache_skip_authorization" $sympress_cache_skip {
    default 1;
    "00000" 0;
}
