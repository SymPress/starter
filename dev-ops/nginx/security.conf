# Include before ANY generic asset/PHP location. Never use ^~ on uploads.
autoindex off;
location ~* ^/(?:[_0-9a-z-]+/)?wp-content/(?:uploads|cache|upgrade)/.*\.(?:php[0-9s]*|pht(?:ml)?|phar|inc)(?:/|$) {
    return 404;
}
location ~* ^/(?:wp/)?xmlrpc\.php(?:/|$) {
    return 403;
}
location ~* /\.(?!well-known/) {
    deny all;
}
location ~* \.(?:sql|bak|ini|log|conf|sh|env)(?:$|/) {
    deny all;
}
