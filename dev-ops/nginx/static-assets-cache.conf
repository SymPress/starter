# Immutable paths belong to compiled theme/plugin assets, never user uploads.
location ~* "^/wp-content/(?:themes|plugins)/[^/]+/(?:assets|build|dist)/.*[.-][a-f0-9]{8,64}\.(?:css|js|mjs|avif|gif|ico|jpe?g|png|svg|webp|woff2?)$" {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /var/www/html/dev-ops/nginx/security-headers.conf;
}
# Query versioning alone does not make a path immutable. Manifests stay fresh.
location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|json|mjs|mp4|ogg|otf|png|svg|ttf|webm|webp|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    include /var/www/html/dev-ops/nginx/security-headers.conf;
}
