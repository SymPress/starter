; FPM production; validate using php --ini and php-fpm -tt before reload.
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL
memory_limit=256M
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
; Immutable release paths plus graceful FPM reload on deploy AND rollback.
opcache.validate_timestamps=0
opcache.revalidate_path=1
; Optional preload is generated from the release's authoritative class map.
; Never preload WordPress bootstrap files or application hooks.
; opcache.preload=/srv/sympress/current/dev-ops/preload.php
; opcache.preload_user=www-data
