; FPM production; validate using php --ini and php-fpm -tt before reload.
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL
memory_limit=256M
; Install in FPM only. CLI/Composer/migration workers need their own configuration.
disable_functions=exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
; Adapt this site-specific path before installation. Temporary files remain private.
open_basedir=/srv/sympress:/tmp:/run/secrets:/etc/ssl/certs:/usr/share/zoneinfo
zend.exception_ignore_args=On
opcache.enable=1
opcache.enable_cli=0
; Supported WordPress production profile: retain OPcache without JIT.
opcache.jit=disable
opcache.jit_buffer_size=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
; Immutable release paths plus graceful FPM reload on deploy AND rollback.
opcache.validate_timestamps=0
opcache.revalidate_path=1
; Optional preload is generated from the release's authoritative class map.
; Never preload WordPress bootstrap files or application hooks.
; opcache.preload=/srv/sympress/current/dev-ops/preload.php
; opcache.preload_user=www-data
