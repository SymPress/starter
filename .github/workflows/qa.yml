name: QA

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    uses: sympress/workflows/.github/workflows/sympress-qa.yml@cd809f3986df3ea617d2d26bdf21ab69cae19c1e
    with:
      include_root: true
      package_glob: .github/no-composer-packages/*
      php_version: '8.5'
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}

  operations-tests:
    name: Operations safety tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up native PHP test environment
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: curl, dom, mbstring, opcache, xml, zip
          tools: composer:2.10.3
          coverage: none
      - name: Install native operation fixtures
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y software-properties-common
          sudo add-apt-repository --yes ppa:ondrej/php
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y php8.5-fpm libfcgi-bin nginx
          composer install --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
          composer install --working-dir=deployment --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
      - name: Verify backup, restore and monitoring controls
        run: |
          python3 - <<'PY'
          import unittest
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.discover('dev-ops/tests'))
          if result.skipped:
              raise SystemExit('Native operation fixtures must run without skipped tests.')
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  deploy-recipe:
    name: Complete recipe on disposable SSH host
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build isolated SSH, MariaDB and FPM host
        run: docker build --tag sympress-deploy-host --file dev-ops/tests/deploy-host.Dockerfile .
      - name: Exercise two complete deployments and authoritative PHP-user checks
        run: |
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace" sympress-deploy-host '
            set -euo pipefail
            git config --global --add safe.directory /workspace
            install -d -o mysql -g mysql /run/mysqld
            if [ ! -f /var/lib/mysql/ibdata1 ]; then
              mariadb-install-db --user=mysql --datadir=/var/lib/mysql --skip-test-db >/dev/null
            fi
            mariadbd --user=mysql --bind-address=127.0.0.1 --skip-log-bin >/tmp/mariadb.log 2>&1 &
            for attempt in {1..100}; do
              mariadb-admin ping --silent >/dev/null 2>&1 && break
              sleep .1
            done
            composer install --no-scripts --prefer-dist --no-interaction --no-progress
            composer install --working-dir=deployment --no-plugins --no-scripts --prefer-dist --no-interaction --no-progress
            python3 dev-ops/tests/deploy_host_probe.py
          '
