name: Audited deploy consumer canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/deploy-audit-canary.yml'
      - 'deployment/audit-probe.php'
      - 'deployment/composer.*'

permissions:
  contents: read
  actions: read
  attestations: write
  id-token: write

jobs:
  deploy:
    uses: SymPress/workflows/.github/workflows/deploy-deployer.yml@2ed4e3bca97fae7cda4d08b176199e2a47a9503e
    with:
      environment: fixture
      working_directory: deployment
      deployment_directory: deployment
      use_ssh: false
      allow_custom_deploy_command: true
      deploy_command: './vendor/bin/dep --file=audit-probe.php deploy "$1"'
