name: DDEV Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ddev-smoke:
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@v1
    with:
      php_version: '8.5'
      allow_custom_commands: true
      ddev_setup_command: bin/console setup sympress-starter
      playwright_install_command: ':'
      playwright_command: |
        ddev exec wp core is-installed
        ddev exec wp db check
        curl -k -I --fail --max-time 20 https://sympress-starter.ddev.site
    secrets:
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
