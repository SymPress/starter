name: DDEV Smoke

on:
  schedule:
    - cron: '6 4 * * 3'
  workflow_dispatch:
    inputs:
      update_dependencies:
        description: Exercise the fresh stable dependency update path
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ddev-smoke:
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@a044303b8492b0c6be48bd9c9fccdc36fb0a9794
    with:
      checkout_ref: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_dependencies)) && 'v1.2.0' || '' }}
      php_version: '8.5'
      composer_update: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_dependencies) }}
      allow_custom_commands: true
      setup_command: |
        set -euo pipefail
        cp .env.example .env
        ddev exec php dev-ops/prepare-env.php
        primary_url="$(ddev describe -j | jq -r '.raw.primary_url // empty')"
        test -n "$primary_url"
        perl -0pi -e "s#https://sympress-starter\\.ddev\\.site#$primary_url#g" .env
        canary_mode="$(bash .github/scripts/canary-mode.sh)"
        printf 'Canary dependency mode: %s\n' "$canary_mode"
        ddev composer install --no-interaction
        ddev composer runtime:setup --no-interaction
      playwright_install_command: ':'
      playwright_run_command: |
        set -euo pipefail
        ddev composer qa
        ddev exec wp core is-installed
        ddev exec wp db check
        primary_url="$(ddev describe -j | jq -r '.raw.primary_url // empty')"
        test -n "$primary_url"
        curl -k -I --fail --max-time 20 "$primary_url"
      playwright_artifact_name: sympress-starter-canary-evidence
      playwright_artifact_path: composer.lock
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
