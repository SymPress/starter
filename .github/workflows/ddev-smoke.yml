name: DDEV Smoke

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ddev-smoke:
    uses: sympress/workflows/.github/workflows/ddev-playwright.yml@b68ed03c15db6d2fac85d8345bc22a6229b4f4b2
    with:
      php_version: '8.5'
      allow_custom_commands: true
      ddev_start_command: ':'
      setup_command: |
        cp .env.example .env
        ddev start
        primary_url="$(ddev describe -j | jq -r '.raw.primary_url // empty')"
        test -n "$primary_url"
        perl -0pi -e "s#https://sympress-starter\\.ddev\\.site#$primary_url#g" .env
        ddev composer install --no-interaction
        ddev composer runtime:setup --no-interaction
      playwright_install_command: ':'
      playwright_run_command: |
        ddev exec wp core is-installed
        ddev exec wp db check
        primary_url="$(ddev describe -j | jq -r '.raw.primary_url // empty')"
        test -n "$primary_url"
        curl -k -I --fail --max-time 20 "$primary_url"
    secrets:
      SSH_KEY: ${{ secrets.COMPOSER_SSH_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.COMPOSER_SSH_KNOWN_HOSTS }}
      COMPOSER_AUTH_JSON: ${{ secrets.COMPOSER_AUTH_JSON }}
