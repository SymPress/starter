name: Canary failure notification
on:
  workflow_run:
    workflows: ['DDEV Smoke', 'DDEV Canary']
    types: [completed]
    branches: [main]
permissions:
  contents: read
jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Notify explicitly selected repository recipient
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_RECIPIENT: ${{ vars.CI_ALERT_RECIPIENT }}
          FAILED_RUN_URL: ${{ github.event.workflow_run.html_url }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ ! "$ALERT_RECIPIENT" =~ ^[A-Za-z0-9][A-Za-z0-9-]{0,38}$ ]]; then
            echo "::error::Select CI_ALERT_RECIPIENT (GitHub login) to enable canary notifications."
            exit 1
          fi
          title="Canary failed: run $FAILED_RUN_ID"
          existing="$(gh issue list --state open --search "$title in:title" --json title --jq '.[].title')"
          if [[ "$existing" != "$title" ]]; then
            body_file="$(mktemp)"
            printf '@%s A main-branch canary failed.\n\nReview the run: %s\n' "$ALERT_RECIPIENT" "$FAILED_RUN_URL" > "$body_file"
            gh issue create --title "$title" --body-file "$body_file" --assignee "$ALERT_RECIPIENT"
            rm -f "$body_file"
          fi
